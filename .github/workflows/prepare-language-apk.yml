name: Prepare language update APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-language-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 539ff7be896bcb9fd7f1e95ac34e1973120d1021
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Android dependencies and regression tests
        run: |
          dotnet workload install android --skip-manifest-update
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          dotnet build Tests/Tests.csproj -c Release -m:1 -p:SourceRevisionId=66ef5983a5d3 -p:UseSharedCompilation=false
          dotnet Tests/bin/Release/net10.0/Tests.dll
          dotnet build UpdateTests/UpdateTests.csproj -c Release -m:1 -p:UseSharedCompilation=false
          dotnet UpdateTests/bin/Release/net10.0/UpdateTests.dll
      - name: Build the APK for local signing
        run: |
          dotnet build App/App.csproj -c Release -m:1 -p:BuildInParallel=false -p:UseSharedCompilation=false -p:SourceRevisionId=66ef5983a5d3 -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AndroidKeyStore=false
          cp App/bin/Release/net10.0-android/org.pkhex.android.community.apk "$RUNNER_TEMP/PKHeX-Android-0.4.2-unsigned.apk"
          sha256sum "$RUNNER_TEMP/PKHeX-Android-0.4.2-unsigned.apk"
      - name: Temporary build artifact for local signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create language-build-artifact "$RUNNER_TEMP/PKHeX-Android-0.4.2-unsigned.apk" --repo "$GITHUB_REPOSITORY" --target 539ff7be896bcb9fd7f1e95ac34e1973120d1021 --title 'Temporary unsigned build artifact' --notes 'Build artifact for local signing. Do not install. Removed after the signed release is published.' --prerelease --latest=false
