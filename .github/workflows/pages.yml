name: PKHeX Web on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Web/**'
      - 'Editor/**'
      - 'Localization/**'
      - 'upstream/**'
      - 'global.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restore WebAssembly packages
        run: dotnet restore Web/PKHeX.Web.csproj
      - name: Publish static Blazor WebAssembly site
        run: dotnet publish Web/PKHeX.Web.csproj -c Release -o publish --no-restore
      - name: Prepare site for GitHub Pages project path
        run: |
          test -f publish/wwwroot/index.html
          test -f publish/wwwroot/_framework/blazor.webassembly.js
          touch publish/wwwroot/.nojekyll
          cp publish/wwwroot/index.html publish/wwwroot/404.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
