name: Complete PKHeX Android project import
on:
  push:
    branches: [main]
    paths: ['.import/payloads.json']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Restore and verify project and existing signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .import/restore.py
      - name: Install complete source on main
        run: |
          cp .github/workflows/import-project.yml "$RUNNER_TEMP/import-project.yml"
          git bundle verify "$RUNNER_TEMP/pkhex-import/project.bundle"
          git fetch "$RUNNER_TEMP/pkhex-import/project.bundle" refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$PKHEX_SOURCE_COMMIT"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$PKHEX_SOURCE_TREE"
          python3 - <<'PY'
          import subprocess
          names = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', 'FETCH_HEAD'], text=True).splitlines()
          assert len(names) == 6862
          assert not any(n.lower().endswith(('.keystore', '.jks', '.p12', '.pfx', '.pem', '.key')) for n in names)
          PY
          git read-tree --reset -u FETCH_HEAD
          cp "$RUNNER_TEMP/import-project.yml" .github/workflows/import-project.yml
          git add .github/workflows/import-project.yml
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import complete PKHeX Android 0.4.1 source, artwork and tests'
          git push origin HEAD:main
          echo "PKHEX_IMPORTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish APK 0.4.1 and complete source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('.github/workflows/import-project.yml').unlink()
          PY
          python3 scripts/package_release.py --apk "$RUNNER_TEMP/pkhex-import/PKHeX-Android-0.4.1.apk" --output "$RUNNER_TEMP/pkhex-release"
          python3 - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'pkhex-release'
          manifest = json.loads((output / 'update.json').read_text())
          assert manifest['versionName'] == '0.4.1' and manifest['versionCode'] == 5
          assert manifest['sha256'] == '301543e52dfb42b36c8c1543edcd6aacb371e37be42dcfdf86002b647a5f1f2c'
          assert manifest['sizeBytes'] == 148888313
          with zipfile.ZipFile(output / 'PKHeX-Android-0.4.1-Quellcode.zip') as z:
              assert z.testzip() is None
              assert not any(n.lower().endswith(('.keystore', '.jks', '.p12', '.pfx', '.pem', '.key')) for n in z.namelist())
              assert len([n for n in z.namelist() if n.endswith('.webp')]) == 3258
          PY
          gh release create v0.4.1 "$RUNNER_TEMP/pkhex-release/PKHeX-Android-0.4.1.apk" "$RUNNER_TEMP/pkhex-release/update.json" "$RUNNER_TEMP/pkhex-release/PKHeX-Android-0.4.1-Quellcode.zip" --repo "$GITHUB_REPOSITORY" --target "$PKHEX_IMPORTED_COMMIT" --title 'PKHeX Android 0.4.1' --notes-file "$RUNNER_TEMP/pkhex-release/release-notes.md" --draft
          gh release edit v0.4.1 --repo "$GITHUB_REPOSITORY" --draft=false --latest
